repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3          # wird durch "pre-commit autoupdate" ersetzt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
